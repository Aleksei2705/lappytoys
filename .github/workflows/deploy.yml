name: Build and publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run fetch-instagram
        continue-on-error: true
        env:
          NEXT_PUBLIC_INSTAGRAM_FEED_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_FEED_URL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TELEGRAM_BOT_TOKEN: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_TOKEN }}
          NEXT_PUBLIC_TELEGRAM_CHAT_ID: ${{ secrets.NEXT_PUBLIC_TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_INSTAGRAM_FEED_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_FEED_URL }}

      - name: Publish static site to deploy branch
        run: |
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy from ${GITHUB_SHA}"
          git branch -M deploy
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Plesk pull webhook (optional)
        env:
          PLESK_DEPLOY_WEBHOOK_URL: ${{ secrets.PLESK_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$PLESK_DEPLOY_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$PLESK_DEPLOY_WEBHOOK_URL"
          else
            echo "PLESK_DEPLOY_WEBHOOK_URL not set — skip auto pull"
          fi
        continue-on-error: true

name: Publish PHP site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish PHP site to deploy branch
        run: |
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a \
            --exclude '.env' \
            --exclude '*.zip' \
            php/ "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy from ${GITHUB_SHA}"
          git branch -M deploy
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Plesk pull webhook
        env:
          PLESK_DEPLOY_WEBHOOK_URL: ${{ secrets.PLESK_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$PLESK_DEPLOY_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$PLESK_DEPLOY_WEBHOOK_URL"
          else
            echo "PLESK_DEPLOY_WEBHOOK_URL not set — skip auto pull"
          fi
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ask Yandex and IndexNow to recrawl the sitemap
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
